      <stop offset="0%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>
  <style>
    .tube-dead { fill: url(#deadGradient); filter: url(#shadow); }
    .cap-dead { fill: url(#deadCap); }
    
    .tube-happy { fill: url(#happyGradient); filter: url(#shadow); }
    .cap-happy { fill: url(#happyCap); }
    
    .tube-neutral { fill: url(#neutralGradient); filter: url(#shadow); }
    .cap-neutral { fill: url(#neutralCap); }
    
    .tube-alert { fill: url(#alertGradient); filter: url(#shadow); }
    .cap-alert { fill: url(#alertCap); }

    .crimp { stroke: rgba(0, 0, 0, 0.2); stroke-width: 2; stroke-linecap: round; }
    .face { fill: none; stroke: #FFFFFF; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .face-solid { fill: #FFFFFF; }
    .label { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #64748B; text-anchor: middle; }
  </style>
