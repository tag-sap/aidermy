# nginx snippet: вставить внутрь server { ... } блока для aidermy.ru.
# V2 preview обслуживается как статический билд Vite по пути /ver2/,
# полностью изолированно от основного Next.js-сайта (/).

    # === V2 REDESIGN PREVIEW (статический билд Vite → /ver2/) ===
    location = /ver2 {
        return 301 /ver2/;
    }

    location /ver2/ {
        alias /var/www/aidermy-ver2/figma-make-preview/dist/;
        index index.html;
        try_files $uri $uri/ /ver2/index.html;
    }
